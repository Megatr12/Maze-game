<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAZE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

#game {
    text-align: center;
}

h1 {
    margin: 0 0 6px;
    font-size: 32px;
}

#info {
    margin-bottom: 10px;
    font-size: 16px;
}

canvas {
    display: block;
    width: 800px;
    height: 500px;
    max-width: 95vw;
    max-height: 65vh;

    background: #39a852;
    border: 5px solid white;
}

.screen {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,0.96);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    z-index: 10;
}

#winScreen {
    display: none;
}

.screen h1 {
    font-size: 50px;
}

.screen p {
    font-size: 18px;
}

.mainButton {
    margin-top: 20px;
    padding: 15px 35px;

    background: white;
    color: black;

    border: none;
    border-radius: 8px;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;
}

.mainButton:hover {
    transform: scale(1.05);
}

#controls {
    margin-top: 15px;

    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px;

    gap: 5px;
    justify-content: center;
}

#controls button {
    background: #222;
    color: white;

    border: 2px solid #555;
    border-radius: 8px;

    font-size: 24px;

    user-select: none;
    touch-action: none;
}

#up {
    grid-column: 2;
    grid-row: 1;
}

#left {
    grid-column: 1;
    grid-row: 2;
}

#down {
    grid-column: 2;
    grid-row: 2;
}

#right {
    grid-column: 3;
    grid-row: 2;
}
</style>
</head>

<body>

<div id="game">

    <h1>MAZE</h1>

    <div id="info">
        Poziom: <span id="level">1</span>
        &nbsp; | &nbsp;
        Śmierci: <span id="deaths">0</span>
    </div>

    <canvas id="canvas" width="800" height="500"></canvas>

    <div id="controls">
        <button id="up">▲</button>
        <button id="left">◀</button>
        <button id="down">▼</button>
        <button id="right">▶</button>
    </div>

</div>


<!-- START -->

<div id="startScreen" class="screen">

    <h1>MAZE</h1>

    <p>Przejdź przez zielony korytarz.</p>
    <p>Nie dotknij czarnych ścian.</p>
    <p>WASD lub strzałki.</p>

    <button class="mainButton" id="startButton">
        START
    </button>

</div>


<!-- WYGRANA -->

<div id="winScreen" class="screen">

    <h1>🎉 WYGRANA!</h1>

    <p>Udało Ci się przejść wszystkie poziomy!</p>

    <p>
        Śmierci:
        <span id="finalDeaths">0</span>
    </p>

    <button class="mainButton" id="restartButton">
        ZAGRAJ PONOWNIE
    </button>

</div>


<script>

/* ================================
   CANVAS
================================ */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");


/* ================================
   ELEMENTY
================================ */

const levelText = document.getElementById("level");
const deathsText = document.getElementById("deaths");

const startScreen = document.getElementById("startScreen");
const winScreen = document.getElementById("winScreen");

const finalDeaths = document.getElementById("finalDeaths");

const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");


/* ================================
   GRACZ
================================ */

const player = {
    x: 30,
    y: 30,
    size: 16,
    speed: 3
};


/* ================================
   STAN GRY
================================ */

let currentLevel = 0;
let deaths = 0;
let gameStarted = false;


/* ================================
   KLAWISZE
================================ */

/*
   Używamy Set zamiast zwykłego obiektu.
   Dzięki temu restart nie zostawia
   starego stanu klawiszy.
*/

const pressedKeys = new Set();


document.addEventListener("keydown", function(event) {

    const key = event.key.toLowerCase();

    pressedKeys.add(key);

});


document.addEventListener("keyup", function(event) {

    const key = event.key.toLowerCase();

    pressedKeys.delete(key);

});


window.addEventListener("blur", function() {

    pressedKeys.clear();

});


/* ================================
   POZIOMY
================================ */

const levels = [

    {

        start: {
            x: 30,
            y: 30
        },

        finish: {
            x: 740,
            y: 430,
            width: 30,
            height: 30
        },

        walls: [

            { x:100, y:0, width:20, height:350 },
            { x:200, y:150, width:20, height:350 },
            { x:300, y:0, width:20, height:350 },
            { x:400, y:150, width:20, height:350 },
            { x:500, y:0, width:20, height:350 },
            { x:600, y:150, width:20, height:350 },
            { x:700, y:0, width:20, height:350 }

        ]

    },


    {

        start: {
            x: 30,
            y: 430
        },

        finish: {
            x: 740,
            y: 30,
            width: 30,
            height: 30
        },

        walls: [

            { x:100, y:150, width:20, height:350 },
            { x:200, y:0, width:20, height:350 },
            { x:300, y:150, width:20, height:350 },
            { x:400, y:0, width:20, height:350 },
            { x:500, y:150, width:20, height:350 },
            { x:600, y:0, width:20, height:350 },
            { x:700, y:150, width:20, height:350 }

        ]

    },


    {

        start: {
            x: 30,
            y: 30
        },

        finish: {
            x: 740,
            y: 430,
            width: 30,
            height: 30
        },

        walls: [

            { x:150, y:0, width:20, height:250 },
            { x:150, y:350, width:20, height:150 },

            { x:300, y:0, width:20, height:150 },
            { x:300, y:250, width:20, height:250 },

            { x:450, y:0, width:20, height:250 },
            { x:450, y:350, width:20, height:150 },

            { x:600, y:0, width:20, height:150 },
            { x:600, y:250, width:20, height:250 },

            { x:700, y:150, width:20, height:200 }

        ]

    }

];


/* ================================
   RESET KLAWISZY
================================ */

function clearKeys() {

    pressedKeys.clear();

}


/* ================================
   RESET GRACZA
================================ */

function resetPlayer() {

    const level = levels[currentLevel];

    player.x = level.start.x;
    player.y = level.start.y;

}


/* ================================
   KOLIZJA
================================ */

function collides(x, y) {

    const level = levels[currentLevel];

    for (const wall of level.walls) {

        if (

            x < wall.x + wall.width &&
            x + player.size > wall.x &&
            y < wall.y + wall.height &&
            y + player.size > wall.y

        ) {

            return true;

        }

    }

    return false;

}


/* ================================
   ŚMIERĆ
================================ */

function die() {

    deaths++;

    deathsText.textContent = deaths;

    clearKeys();

    resetPlayer();

}


/* ================================
   SPRAWDZANIE METY
================================ */

function checkFinish() {

    const finish = levels[currentLevel].finish;

    if (

        player.x < finish.x + finish.width &&
        player.x + player.size > finish.x &&
        player.y < finish.y + finish.height &&
        player.y + player.size > finish.y

    ) {

        nextLevel();

    }

}


/* ================================
   NASTĘPNY POZIOM
================================ */

function nextLevel() {

    currentLevel++;

    clearKeys();


    if (currentLevel >= levels.length) {

        winGame();

        return;

    }


    levelText.textContent = currentLevel + 1;

    resetPlayer();

}


/* ================================
   WYGRANA
================================ */

function winGame() {

    gameStarted = false;

    clearKeys();

    finalDeaths.textContent = deaths;

    winScreen.style.display = "flex";

}


/* ================================
   START
================================ */

function startGame() {

    currentLevel = 0;
    deaths = 0;

    clearKeys();

    resetPlayer();

    levelText.textContent = "1";
    deathsText.textContent = "0";

    startScreen.style.display = "none";
    winScreen.style.display = "none";

    gameStarted = true;

}


/* ================================
   RESTART
================================ */

function restartGame() {

    /*
       Najważniejsza część:
       całkowicie resetujemy stan.
    */

    gameStarted = false;

    clearKeys();

    currentLevel = 0;
    deaths = 0;

    levelText.textContent = "1";
    deathsText.textContent = "0";
    finalDeaths.textContent = "0";

    resetPlayer();

    startScreen.style.display = "none";
    winScreen.style.display = "none";

    /*
       Następna linia uruchamia grę
       od pierwszej klatki.
    */

    gameStarted = true;

}


/* ================================
   AKTUALIZACJA
================================ */

function update() {

    if (!gameStarted) {
        return;
    }


    let dx = 0;
    let dy = 0;


    if (
        pressedKeys.has("arrowup") ||
        pressedKeys.has("w")
    ) {
        dy -= player.speed;
    }


    if (
        pressedKeys.has("arrowdown") ||
        pressedKeys.has("s")
    ) {
        dy += player.speed;
    }


    if (
        pressedKeys.has("arrowleft") ||
        pressedKeys.has("a")
    ) {
        dx -= player.speed;
    }


    if (
        pressedKeys.has("arrowright") ||
        pressedKeys.has("d")
    ) {
        dx += player.speed;
    }


    /*
       RUCH X
    */

    if (dx !== 0) {

        const newX = player.x + dx;

        if (
            newX < 0 ||
            newX + player.size > canvas.width ||
            collides(newX, player.y)
        ) {

            die();

            return;

        }

        player.x = newX;

    }


    /*
       RUCH Y
    */

    if (dy !== 0) {

        const newY = player.y + dy;

        if (
            newY < 0 ||
            newY + player.size > canvas.height ||
            collides(player.x, newY)
        ) {

            die();

            return;

        }

        player.y = newY;

    }


    checkFinish();

}


/* ================================
   RYSOWANIE
================================ */

function draw() {

    const level = levels[currentLevel];


    /*
       TŁO
    */

    ctx.fillStyle = "#39a852";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       ŚCIANY
    */

    ctx.fillStyle = "#000";

    for (const wall of level.walls) {

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.width,
            wall.height
        );

    }


    /*
       META
    */

    ctx.fillStyle = "#fff";

    ctx.fillRect(
        level.finish.x,
        level.finish.y,
        level.finish.width,
        level.finish.height
    );


    /*
       GRACZ
    */

    ctx.fillStyle = "#000";

    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

}


/* ================================
   PĘTLA GRY
================================ */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);

}


/* ================================
   PRZYCISKI
================================ */

startButton.addEventListener(
    "click",
    startGame
);


restartButton.addEventListener(
    "click",
    restartGame
);


/* ================================
   STEROWANIE PRZYCISKAMI
================================ */

function setupButton(id, key) {

    const button = document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            pressedKeys.add(key);

        }
    );


    button.addEventListener(
        "pointerup",
        function(event) {

            event.preventDefault();

            pressedKeys.delete(key);

        }
    );


    button.addEventListener(
        "pointercancel",
        function() {

            pressedKeys.delete(key);

        }
    );


    button.addEventListener(
        "pointerleave",
        function() {

            pressedKeys.delete(key);

        }
    );

}


setupButton("up", "arrowup");
setupButton("down", "arrowdown");
setupButton("left", "arrowleft");
setupButton("right", "arrowright");


/* ================================
   URUCHOMIENIE
================================ */

resetPlayer();

draw();

gameLoop();

</script>

</body>
</html>
